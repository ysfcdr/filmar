    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #131720;
            --primary: #e50914;
            --text-main: #ffffff;
            --text-muted: #8c96a6;
            --nav-bg: rgba(18, 22, 31, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        /* Üst Navigasyon Barı (Header) */
        header {
            position: sticky;
            top: 0;
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 50px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tür Filtreleme Menüsü */
        .nav-links {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-item {
            padding: 8px 18px;
            border-radius: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            color: #fff;
            background: var(--primary);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px 8px 36px;
            border-radius: 20px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            width: 200px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            width: 260px;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.12);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Ana İçerik Alanı */
        main {
            max-width: 1400px;
            margin: 30px auto 0 auto;
            padding: 0 30px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        /* Film Kartları Izgarası (Grid) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6);
        }

        .poster-container {
            width: 100%;
            height: 270px;
            position: relative;
        }

        .poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Hover Play Overlay */
        .card-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .card:hover .card-overlay {
            opacity: 1;
        }

        .play-btn-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(225, 9, 20, 0.5);
        }

        .card-info {
            padding: 12px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .card-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .no-result {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            grid-column: 1 / -1;
            font-size: 1.1rem;
        }

        /* Modal Stilleri */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .video-wrapper {
            position: relative;
            width: 90%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            background: #000;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            color: #fff;
            cursor: pointer;
            z-index: 1010;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover { background: var(--primary); }
    </style>
</head>

                    <img class="poster" src="${film.kapak}" alt="${film.isim}" onerror="this.src='https://via.placeholder.com/200x300/131720/fff?text=Afi%C5%9F+Yok'">
                    <div class="card-overlay">
                        <div class="play-btn-circle">▶</div>
                    </div>
                </div>
                <div class="card-info">
                    <div class="card-title">${film.isim}</div>
                    <div class="card-meta">
                        <span>${film.tur}</span>
                    </div>
                </div>
            </div>
        `;
    }

    function ekranYukle(list) {
        const grid = document.getElementById("filmGrid");
        grid.innerHTML = "";

        if (list.length === 0) {
            grid.innerHTML = `<div class="no-result">Aradığınız kriterde film bulunamadı. 🎬</div>`;
            return;
        }

        list.forEach(film => {
            grid.innerHTML += kartOlustur(film);
        });
    }

    function aramaYap() {
        const query = document.getElementById("searchInput").value.toLowerCase();
        const filtrelenmis = filmler.filter(f => {
            // İsmi veya varsa altMetin'i kontrol et
            const isimElesiyor = f.isim.toLowerCase().includes(query);
            const altMetinElesiyor = f.altMetin ? f.altMetin.toLowerCase().includes(query) : false;

            const aramaUygun = isimElesiyor || altMetinElesiyor;
            const turUygun = (aktifTur === 'Tümü') || (f.tur === aktifTur);

            return aramaUygun && turUygun;
        });
        ekranYukle(filtrelenmis);
    }

    function turFiltrele(tur, element) {
        aktifTur = tur;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        document.getElementById("sectionTitle").innerText = tur === 'Tümü' ? 'Tüm Filmler' : `${tur} Filmleri`;

        aramaYap();
    }

    async function filmiAc(link) {
        const modal = document.getElementById("videoModal");
        const container = document.getElementById("playerContainer");

        container.innerHTML = `
            <vm-player id="vimePlayer" autoplay>
                <vm-video id="vimeVideo" preload="auto">
                    <source src="${link}" type="video/mp4" />
                </vm-video>
                <vm-default-ui></vm-default-ui>
            </vm-player>
        `;

        modal.style.display = "flex";

        const player = document.getElementById("vimePlayer");
        await customElements.whenDefined('vm-player');

        setTimeout(() => {
            if (player && player.play) {
                player.play().catch(e => console.log("Oynatma başlatılamadı:", e));
            }
        }, 200);
    }

    function videoKapat() {
        const modal = document.getElementById("videoModal");
        const container = document.getElementById("playerContainer");

        container.innerHTML = "";
        modal.style.display = "none";
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') videoKapat();
    });

    ekranYukle(filmler);
    </script>
</body>
</html>
